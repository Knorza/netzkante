r-spacing:.1em;color:#5a6a63}.team b{display:block;font-size:.85rem;margin-top:5px}.players{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.player{display:flex;gap:8px;align-items:center;border:1px solid #ded8ca;background:var(--paper);border-radius:10px;padding:10px;text-align:left;color:var(--ink);font-weight:800}.player.selected{background:var(--gold);border-color:#c39e2b}.dot{font-weight:950;color:#6b766f;min-width:16px}.small-actions{display:flex;gap:12px;margin:12px 0}.link{border:0;background:transparent;color:#1a6070;padding:0;font-size:.8rem;font-weight:900}.court{height:255px;display:grid;grid-template-columns:1fr 9px 1fr;border:5px solid #fff9eb;border-radius:16px;overflow:visible;box-shadow:0 8px 18px #122a2533;margin-top:8px}.side{border:0;color:#fffdf3;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.side.left{background:var(--green)}.side.right{background:var(--green2);text-align:right}.tap{font-size:.66rem;letter-spacing:.1em;color:#d8eadb;font-weight:900}.net{background:#f5e8cc;position:relative}.scorebox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:148px;text-align:center;border:2px solid var(--gold);background:var(--forest);border-radius:10px;padding:9px}.score{font-size:2rem;color:#fffaf0;font-weight:950;font-variant-numeric:tabular-nums}.score i{font-style:normal;color:var(--gold)}.scorebox small{color:var(--gold);font-size:.55rem;letter-spacing:.13em;font-weight:900}.setline{font-size:.76rem;color:#5d6d66;font-weight:800;margin:9px 0}.finished{padding:10px;text-align:center;color:#196037;background:#e0f2e4;border-radius:10px;font-weight:900;font-size:.8rem;margin-top:10px}.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:10px;min-height:48px;padding:11px 15px;font-weight:900;flex:1}.primary{background:#d6a62b;color:#1c291e}.secondary{background:#e0ded5;color:#25352e}.danger{color:var(--red)}.match{border-left:5px solid var(--green)}.meta{font-size:.75rem;font-weight:900;color:#8d6b19}.teams{font-size:1rem;font-weight:950;margin-top:7px}.vs{font-size:.7rem;color:#77837e;margin:2px 0}.sets{font-size:.77rem;color:#617069;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #e3ddcf;padding:11px 0}.row:last-child{border:0}.statname{font-weight:900}.statvalue{font-size:.8rem;color:#607069}.win{color:#247040;font-weight:950}.empty{padding:25px 4px;color:#718078;font-style:italic}.summary{white-space:pre-wrap;background:#fbf7ec;border:1px dashed #cbbd95;border-radius:12px;padding:14px;color:#25372f;line-height:1.52;font-size:.88rem}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#122a25;color:white;padding:11px 15px;border-radius:99px;font-size:.8rem;font-weight:850;z-index:5}.modal{position:fixed;inset:0;background:#10251c88;display:flex;align-items:end;z-index:3}.sheet{width:min(720px,100%);max-height:88dvh;overflow:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:20px}.sheet h2{margin:0 0 12px}.setedit{display:flex;align-items:center;gap:7px;margin:8px 0}.setedit input{width:48px;text-align:center}.setedit b{width:55px;font-size:.8rem}.install{font-size:.72rem;color:#c8ddcf;margin:10px 0 0}.share{display:grid;grid-template-columns:1.4fr 1fr;gap:9px}.manager{margin-top:18px}.manager h3{font-size:.8rem;letter-spacing:.1em;color:#5e7069}.hidden{display:none}@media(min-width:650px){.app{box-shadow:0 0 40px #152c2222}.head{border-radius:0 0 18px 18px}}
    .serve-line{display:flex;justify-content:space-between;align-items:center;margin:12px 0 7px;color:#596b64;font-size:.74rem;font-weight:900;letter-spacing:.06em}.serve-green{color:#277b4b}.serve-blue{color:#246f9a}.full-btn{border:1px solid #b6c9da;background:#edf6ff;color:#246080;border-radius:9px;padding:8px 11px;font-size:.76rem;font-weight:900;margin:0 0 8px}.full-serve{display:none}.court:fullscreen{width:100vw;height:100vh;border-radius:0;border:0;padding-top:58px}.court:fullscreen .full-serve{display:block;position:absolute;top:18px;left:0;right:0;text-align:center;color:#eaf5ff;font-size:1rem;letter-spacing:.08em;font-weight:900}.court:fullscreen .net{margin-top:25px}.court:fullscreen .side{font-size:1.35rem;padding:28px}.court:fullscreen .tap{font-size:.9rem}.court:fullscreen .scorebox{width:230px;padding:18px}.court:fullscreen .score{font-size:4rem}.editor-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editor-teams .text-input{margin-top:7px;font-size:.8rem;padding:9px}.green-name{color:#25764a;font-size:.72rem;letter-spacing:.08em}.blue-name{color:#246f9a;font-size:.72rem;letter-spacing:.08em}.file-btn{display:grid;place-items:center;position:relative}.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}.transfer{margin-top:18px}.court .left{background:#2b83ad}.court .right{background:#236c9d}.serve-line+ .full-btn{display:block}.search{}.fallback{margin-top:14px;color:var(--muted);font-size:.82rem}.fallback summary{cursor:pointer;font-weight:800}.fallback .share{margin-top:10px}.transfer-input{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;background:#fffdf7;color:var(--ink);padding:11px;margin:10px 0 2px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;line-height:1.35}@media(orientation:landscape){.court:fullscreen{height:100vh}.court:fullscreen .side{font-size:1.45rem}}

<body><main id="app" class="app"></main><div id="toast" class="toast hidden"></div>
<script>
const KEY='netzkante-pwa-v1';
const START=['Sepp','Günther','Thomas','Marc','Arthur 1','Arthur 2','Daniela','Werner','Manfred','Claudia'].map((name,i)=>({id:String(i+1),name}));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{let d=new Date();return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`};
const dateKey=d=>{let x=String(d||'').match(/^(\d{4})-(\d\d)-(\d\d)$/);if(x)return `${x[1]}-${x[2]}-${x[3]}`;x=String(d||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return x?`${x[3]}-${pad(x[2])}-${pad(x[1])}`:String(d||'')};
const showDate=d=>{let x=String(d||'').match(/^(\d{4})-(\d\d)-(\d\d)$/);return x?`${x[3]}.${x[2]}.${x[1]}`:d};
const blank=()=>({date:today(),left:[],right:[],sets:[],current:{left:0,right:0},history:[],openingServer:'left'});
let S={players:START,matches:[],match:blank(),tab:'spiel',active:'left',edit:null,manage:false};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{});if(!S.match)S.match=blank()}catch(e){};
const save=()=>localStorage.setItem(KEY,JSON.stringify({players:S.players,matches:S.matches,match:S.match}));
const won=(a,b)=>a>=11&&a-b>=2, winner=s=>won(s.left,s.right)?'left':won(s.right,s.left)?'right':null, wins=(sets,side)=>sets.filter(s=>winner(s)===side).length, complete=m=>wins(m.sets,'left')===2||wins(m.sets,'right')===2;
function serving(m){let t=m.current.left+m.current.right,changes=t<20?Math.floor(t/2):10+(t-20),start=m.openingServer||'left';return changes%2?start==='left'?'right':'left':start}
const name=id=>S.players.find(p=>p.id===id)?.name||'Gelöschter Spieler', team=ids=>ids.map(name).join(' + ')||'—', esc=x=>String(x||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function app(h,keepScroll=false){document.querySelector('#app').innerHTML=h;if(!keepScroll)window.scrollTo(0,0)}
function tabs(){return `<header class="head"><div class="brand">NETZKANTE</div><div class="sub">DOPPEL · ABENDBUCH</div><div class="tabs">${[['spiel','Partie'],['liste','Liste'],['abend','Abend']].map(([id,n])=>`<button class="tab ${S.tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}</div></header>`}
function go(t){S.tab=t;render()}
function render(keepScroll=false){if(S.tab==='spiel')play(keepScroll);else if(S.tab==='liste')list(keepScroll);else evening(keepScroll)}
function play(keepScroll=false){let m=S.match,lw=wins(m.sets,'left'),rw=wins(m.sets,'right');app(`${tabs()}<section class="page"><div class="card"><p class="label">DATUM DES ABENDS</p><input class="date-input" value="${esc(showDate(m.date))}" oninput="S.match.date=this.value;save()" placeholder="TT.MM.JJJJ"></div><h1 class="title">Doppel auswählen</h1><p class="hint">Zuerst zwei Namen für Grün, dann zwei für Blau. Ein ausgewählter Name lässt sich erneut antippen und entfernen.</p><div class="team-select"><button class="team left ${S.active==='left'?'on':''}" onclick="S.active='left';render()"><small>GRÜN</small><b>${esc(team(m.left))}</b></button><button class="team right ${S.active==='right'?'on':''}" onclick="S.active='right';render()"><small>BLAU</small><b>${esc(team(m.right))}</b></button></div><div class="players">${S.players.map((p,i)=>`<button class="player ${(m.left.includes(p.id)||m.right.includes(p.id))?'selected':''}" onclick="choose('${p.id}')"><span class="dot">${i+1}</span>${esc(p.name)}</button>`).join('')}</div><div class="small-actions"><button class="link" onclick="addPlayer()">＋ Spieler hinzufügen</button><button class="link" onclick="managePlayers()">Spielerliste bearbeiten</button></div><h1 class="title">Am Tisch</h1><p class="setline">SÄTZE ${lw} : ${rw} · ${m.sets.map((s,i)=>`${i+1}. ${s.left}:${s.right}`).join(' · ')||'Noch kein Satz'}</p><div class="serve-line"><span>AUFSCHLAG: <b class="${serving(m)==='left'?'serve-green':'serve-blue'}">${esc(team(serving(m)==='left'?m.left:m.right))}</b></span><button class="link" onclick="S.match.openingServer=(S.match.openingServer||'left')==='left'?'right':'left';save();render(true)">Aufschlag wechseln</button></div><button class="full-btn" onclick="fullCourt()">⛶ Tisch im Vollbild</button><div class="court" id="court"><div class="full-serve">AUFSCHLAG · <b id="fullserve" class="${serving(m)==='left'?'serve-green':'serve-blue'}">${esc(team(serving(m)==='left'?m.left:m.right))}</b></div><button class="side left" onclick="point('left')"><b>${esc(team(m.left))}</b><span class="tap">TIPPE FÜR PUNKT</span></button><div class="net"><div class="scorebox"><div class="score" id="fullscore">${m.current.left}<i> : </i>${m.current.right}</div><small>LAUFENDER SATZ</small></div></div><button class="side right" onclick="point('right')"><b>${esc(team(m.right))}</b><span class="tap">TIPPE FÜR PUNKT</span></button></div>${complete(m)?`<div class="finished">PARTIE ENTSCHIEDEN · ${esc(team(lw===2?m.left:m.right))} gewinnt</div>`:''}<div class="actions"><button class="btn secondary" onclick="undo()">↶ Schritt zurück</button><button class="btn primary" onclick="saveMatch()">Partie speichern</button></div></section>`,keepScroll)}
function choose(id){let m=S.match,side=S.active;if(m[side].includes(id))m[side]=m[side].filter(x=>x!==id);else if(m.left.includes(id)||m.right.includes(id)){m.left=m.left.filter(x=>x!==id);m.right=m.right.filter(x=>x!==id)}else{if(m[side].length>=2)return toast('Dieses Doppel-Team ist voll.');m[side].push(id);if(side==='left'&&m.left.length===2)S.active='right'}save();render()}
function point(side){let m=S.match;if(complete(m))return toast('Partie beendet – bitte speichern oder neu starten.');if(m.left.length!==2||m.right.length!==2)return toast('Bitte zuerst zwei Spieler pro Seite wählen.');let before={...m.current};m.history.push(before);m.current[side]++;if(won(m.current.left,m.current.right)||won(m.current.right,m.current.left)){m.sets.push({...m.current});m.current={left:0,right:0};m.openingServer=(m.openingServer||'left')==='left'?'right':'left'}save();if(document.fullscreenElement){updateFullCourt()}else render(true)}
function undo(){let m=S.match;if(!m.history.length)return;let prev=m.history.pop(),last=m.sets.at(-1);if(m.current.left===0&&m.current.right===0&&last&&winner(last)){m.sets.pop();m.openingServer=(m.openingServer||'left')==='left'?'right':'left'}m.current=prev;save();if(document.fullscreenElement){updateFullCourt()}else render(true)}
function saveMatch(){let m=S.match;if(m.left.length!==2||m.right.length!==2)return toast('Bitte zwei Spieler pro Seite wählen.');if(!complete(m))return toast('Eine Mannschaft muss zwei Sätze gewinnen.');S.matches.unshift({...m,id:String(Date.now()),savedAt:new Date().toISOString()});S.match=blank();S.active='left';save();toast('Partie gespeichert.');render()}
function fullCourt(){let c=document.querySelector('#court');if(c?.requestFullscreen)c.requestFullscreen().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>toast('Bitte Gerät ins Querformat drehen.'));else toast('Bitte Gerät ins Querformat drehen.')} 
function updateFullCourt(){let m=S.match,score=document.querySelector('#fullscore'),serve=document.querySelector('#fullserve');if(score)score.innerHTML=`${m.current.left}<i> : </i>${m.current.right}`;if(serve){let side=serving(m);serve.className=side==='left'?'serve-green':'serve-blue';serve.textContent=team(side==='left'?m.left:m.right)}}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){screen.orientation?.unlock?.();render(true)}}); 
function list(){app(`${tabs()}<section class="page"><h1 class="title">Gespeicherte Partien</h1><p class="hint">Partien können nachträglich korrigiert oder gelöscht werden.</p>${!S.matches.length?'<p class="empty">Noch keine Partie gespeichert.</p>':S.matches.map(m=>`<article class="card match"><div class="meta">${esc(showDate(m.date))} · ${wins(m.sets,'left')}:${wins(m.sets,'right')} Sätze</div><div class="teams">${esc(team(m.left))}</div><div class="vs">gegen</div><div class="teams">${esc(team(m.right))}</div><div class="sets">${m.sets.map((s,i)=>`${i+1}. Satz ${s.left}:${s.right}`).join(' · ')}</div><div class="small-actions"><button class="link" onclick="editMatch('${m.id}')">Ändern</button><button class="link danger" onclick="deleteMatch('${m.id}')">Löschen</button></div></article>`).join('')}</section>`)}
function deleteMatch(id){if(!confirm('Diese Partie endgültig löschen?'))return;S.matches=S.matches.filter(m=>m.id!==id);save();render()}
function editMatch(id){S.edit=JSON.parse(JSON.stringify(S.matches.find(m=>m.id===id)));matchSheet()}
function playerSelect(side,i){let chosen=S.edit[side][i]||'';return `<select class="text-input" onchange="S.edit.${side}[${i}]=this.value"><option value="">Spieler wählen</option>${S.players.map(p=>`<option value="${p.id}" ${p.id===chosen?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}
function matchSheet(){let m=S.edit;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><section class="sheet"><h2>Partie korrigieren</h2><p class="label">DATUM</p><input class="text-input" value="${esc(showDate(m.date))}" oninput="S.edit.date=this.value" placeholder="TT.MM.JJJJ"><p class="label" style="margin-top:15px">TEAMS</p><div class="editor-teams"><div><b class="green-name">GRÜN</b>${playerSelect('left',0)}${playerSelect('left',1)}</div><div><b class="blue-name">BLAU</b>${playerSelect('right',0)}${playerSelect('right',1)}</div></div><p class="label" style="margin-top:15px">SATZERGEBNISSE</p>${m.sets.map((s,i)=>`<div class="setedit"><b>${i+1}. Satz</b><input class="text-input" inputmode="numeric" value="${s.left}" oninput="S.edit.sets[${i}].left=Math.max(0,+this.value||0)"><strong>:</strong><input class="text-input" inputmode="numeric" value="${s.right}" oninput="S.edit.sets[${i}].right=Math.max(0,+this.value||0)"><button class="link danger" onclick="S.edit.sets.splice(${i},1);closeModal();matchSheet()">Löschen</button></div>`).join('')}<button class="link" onclick="S.edit.sets.push({left:0,right:0});closeModal();matchSheet()">＋ Satz hinzufügen</button><div class="actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="commitEdit()">Änderungen speichern</button></div></section></div>`)}
function closeModal(){document.querySelector('#modal')?.remove()}function commitEdit(){if([...S.edit.left,...S.edit.right].some(x=>!x)||new Set([...S.edit.left,...S.edit.right]).size!==4)return toast('Bitte vier verschiedene Spieler wählen.');S.matches=S.matches.map(m=>m.id===S.edit.id?S.edit:m);closeModal();save();render()}
function evening(){let date=S.match.date,ms=S.matches.filter(m=>dateKey(m.date)===dateKey(date)),p={},pairs={};ms.forEach(m=>{let w=wins(m.sets,'left')>wins(m.sets,'right')?'left':'right';['left','right'].forEach(side=>{m[side].forEach(id=>{p[id]??={games:0,wins:0};p[id].games++;if(side===w)p[id].wins++});let k=[...m[side]].sort().join('|');pairs[k]??={ids:m[side],count:0};pairs[k].count++})});let summary=makeSummary(date,ms,p);app(`${tabs()}<section class="page"><div class="card"><p class="label">ABEND AUSWÄHLEN</p><input class="date-input" value="${esc(showDate(date))}" oninput="S.match.date=this.value;save()" placeholder="TT.MM.JJJJ"></div><h1 class="title">Zusammenfassung</h1><p class="hint">Alle Werte beziehen sich auf den ausgewählten Abend.</p><div class="card"><p class="label">PARTIEN</p><b style="font-size:3rem;color:#d09b24">${ms.length}</b></div><p class="label">SPIELERBILANZ</p>${!Object.keys(p).length?'<p class="empty">Für dieses Datum gibt es noch keine Partien.</p>':Object.entries(p).sort((a,b)=>b[1].wins-a[1].wins||b[1].games-a[1].games).map(([id,x])=>`<div class="row"><span class="statname">${esc(name(id))}</span><span class="statvalue">${x.games} Spiele · <b class="win">${x.wins} Siege (${Math.round(x.wins/x.games*100)} %)</b></span></div>`).join('')}<p class="label" style="margin-top:22px">HÄUFIGSTE PAARUNGEN</p>${!Object.keys(pairs).length?'<p class="empty">Noch keine Doppel-Paarung.</p>':Object.values(pairs).sort((a,b)=>b.count-a.count).map((x,i)=>`<div class="row"><span class="statname">${i+1}. ${esc(team(x.ids))}</span><span class="statvalue">${x.count}×</span></div>`).join('')}<p class="label" style="margin-top:23px">KURZBERICHT</p><div class="summary">${esc(summary)}</div><div class="share"><button class="btn primary" onclick="shareSummary()">Über WhatsApp teilen</button><button class="btn secondary" onclick="copySummary()">Text kopieren</button></div><div class="card transfer"><p class="label">ABEND ÜBERGEBEN</p><b>Zwischenstand weitergeben</b><p class="hint">Schicke den Zwischenstand direkt als WhatsApp-Text. Die andere Person kopiert ihn und fügt ihn hier wieder ein – ohne Datei-Download.</p><div class="share"><button class="btn primary" onclick="shareTransfer()">Per WhatsApp senden</button><button class="btn secondary" onclick="transferPasteSheet()">Text einfügen</button></div><details class="fallback"><summary>Datei-Variante (optional)</summary><div class="share"><button class="btn secondary" onclick="exportEvening()">Datei exportieren</button><label class="btn secondary file-btn">Datei importieren<input type="file" accept="application/json,.json" onchange="importEvening(this.files[0])"></label></div></details></div></section>`)}
function eveningHighlights(ms,p,pairs){
  let entries=Object.entries(p),people=entries.length;
  let mostGames=Math.max(0,...entries.map(([,x])=>x.games));
  let active=entries.filter(([,x])=>x.games===mostGames).map(([id])=>name(id));
  let eligible=entries.filter(([,x])=>x.games>=2);
  let pool=eligible.length?eligible:entries;
  let bestRate=Math.max(0,...pool.map(([,x])=>x.games?x.wins/x.games:0));
  let best=pool.filter(([,x])=>x.games&&x.wins/x.games===bestRate).map(([id,x])=>({name:name(id),games:x.games,wins:x.wins}));
  let pairList=Object.values(pairs||{}),mostPair=Math.max(0,...pairList.map(x=>x.count));
  let teams=pairList.filter(x=>x.count===mostPair).map(x=>team(x.ids));
  return {people,mostGames,active,bestRate,best,mostPair,teams};
}
function joinNames(a){return a.length<2?a[0]||'—':a.length===2?`${a[0]} und ${a[1]}`:`${a.slice(0,-1).join(', ')} und ${a.at(-1)}`}
function makeSummary(date,ms,p){let pairs={};ms.forEach(m=>['left','right'].forEach(side=>{let k=[...m[side]].sort().join('|');pairs[k]??={ids:m[side],count:0};pairs[k].count++}));let h=eveningHighlights(ms,p,pairs),rate=Math.round(h.bestRate*100);return `🏓 NETZKANTE · ${showDate(date)}\n\n${ms.length} Partie${ms.length===1?'':'n'} gespielt · ${h.people} Person${h.people===1?'':'en'} im Einsatz\n\n🔥 Meiste Einsätze\n${h.mostGames?`${joinNames(h.active)} – ${h.mostGames} Partie${h.mostGames===1?'':'n'}`:'Noch keine Daten'}\n\n🏆 Beste Bilanz${Object.entries(p).some(([,x])=>x.games>=2)?' (mind. 2 Partien)':''}\n${h.best.length?`${joinNames(h.best.map(x=>x.name))} – ${h.best[0].wins} von ${h.best[0].games} gewonnen (${rate} %)`:'Noch keine Daten'}\n\n🤝 Eingespieltestes Doppel\n${h.mostPair?`${joinNames(h.teams)} – ${h.mostPair}× zusammen gespielt`:'Noch keine Daten'}\n\nBis zum nächsten Abend!`}
function shareSummary(){let date=S.match.date,ms=S.matches.filter(m=>dateKey(m.date)===dateKey(date)),p={};ms.forEach(m=>{let w=wins(m.sets,'left')>wins(m.sets,'right')?'left':'right';['left','right'].forEach(side=>m[side].forEach(id=>{p[id]??={games:0,wins:0};p[id].games++;if(side===w)p[id].wins++}))});let text=makeSummary(date,ms,p);if(navigator.share)navigator.share({title:'Netzkante – Abendbericht',text}).catch(()=>{});else{navigator.clipboard?.writeText(text);window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}}
function copySummary(){let ms=S.matches.filter(m=>dateKey(m.date)===dateKey(S.match.date)),p={};ms.forEach(m=>{let w=wins(m.sets,'left')>wins(m.sets,'right')?'left':'right';['left','right'].forEach(side=>m[side].forEach(id=>{p[id]??={games:0,wins:0};p[id].games++;if(side===w)p[id].wins++}))});navigator.clipboard?.writeText(makeSummary(S.match.date,ms,p)).then(()=>toast('Kurzbericht kopiert.'))}
function eveningPayload(){let date=S.match.date;return {kind:'netzkante-evening-v1',date,players:S.players,matches:S.matches.filter(m=>dateKey(m.date)===dateKey(date)),current:dateKey(S.match.date)===dateKey(date)?S.match:null}}
function encodeTransfer(data){return 'NETZKANTE-ABEND-1:'+btoa(unescape(encodeURIComponent(JSON.stringify(data))));}
function decodeTransfer(text){let raw=String(text||'').trim(),match=raw.match(/NETZKANTE-ABEND-1:([A-Za-z0-9+/=]+)/);if(!match)throw new Error('Kein Netzkante-Übergabetext gefunden.');return JSON.parse(decodeURIComponent(escape(atob(match[1]))));}
function mergeEvening(d){if(d.kind!=='netzkante-evening-v1')throw new Error('Ungültiger Zwischenstand.');let ids=new Set(S.matches.map(m=>m.id));S.players=d.players||S.players;(d.matches||[]).forEach(m=>{if(!ids.has(m.id))S.matches.push(m)});if(d.current)S.match=d.current;save();toast(`Abend vom ${showDate(d.date)} übernommen.`);render()}
async function shareTransfer(){let d=eveningPayload(),text=`🏓 NETZKANTE · Zwischenstand ${showDate(d.date)}\n\nKopiere den gesamten Code unten. In Netzkante: Abend → Text einfügen.\n\n${encodeTransfer(d)}`;try{if(navigator.share){await navigator.share({title:'Netzkante – Abendübergabe',text});return}}catch(e){}navigator.clipboard?.writeText(text);toast('Übergabetext kopiert – jetzt in WhatsApp einfügen.');}
function transferPasteSheet(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><section class="sheet"><h2>Abend übernehmen</h2><p class="hint">Kopiere den vollständigen Netzkante-Text aus WhatsApp und füge ihn hier ein.</p><textarea class="transfer-input" id="transfertext" placeholder="NETZKANTE-ABEND-1: …"></textarea><div class="share"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="importTransferText()">Übernehmen</button></div></section></div>`)}
function importTransferText(){try{mergeEvening(decodeTransfer(document.querySelector('#transfertext').value));closeModal()}catch(e){toast(e.message)}}
async function exportEvening(){let date=S.match.date,payload=eveningPayload(),file=new File([JSON.stringify(payload,null,2)],`netzkante-${dateKey(date)}.json`,{type:'application/json'});try{if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:'Netzkante – Abendübergabe',text:`Netzkante-Zwischenstand vom ${showDate(date)}`,files:[file]});return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Abenddatei gespeichert.')} 
function importEvening(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{mergeEvening(JSON.parse(r.result))}catch(e){toast('Diese Datei ist keine Netzkante-Abenddatei.')}};r.readAsText(file)}
function addPlayer(){let n=prompt('Name des neuen Spielers:');if(!n?.trim())return;S.players.push({id:String(Date.now()),name:n.trim()});save();render()}
function managePlayers(){let content=S.players.map(p=>`<div class="row"><b>${esc(p.name)}</b><span><button class="link" onclick="renamePlayer('${p.id}')">Ändern</button> <button class="link danger" onclick="removePlayer('${p.id}')">Löschen</button></span></div>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><section class="sheet"><h2>Spielerliste</h2>${content}<button class="btn secondary" style="margin-top:15px" onclick="closeModal()">Fertig</button></section></div>`)}
function renamePlayer(id){let p=S.players.find(x=>x.id===id),n=prompt('Name',p.name);if(n?.trim()){p.name=n.trim();save();closeModal();render()}}
function removePlayer(id){if(!confirm('Spieler aus der Liste entfernen?'))return;S.players=S.players.filter(p=>p.id!==id);save();closeModal();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
